name: Validate GARAGE project
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate.yml', 'scripts/test-menu.cjs', 'scripts/test-image-transitions.cjs', 'js/**', 'content/**', '.pages.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/test-menu.cjs
      - run: node scripts/test-image-transitions.cjs
