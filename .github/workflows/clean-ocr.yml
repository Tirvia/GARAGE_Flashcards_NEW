name: Clean OCR artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-ocr.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/clean_ocr.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/cards
          git diff --cached --quiet || (git commit -m "Clean OCR glyph artifacts" && (git pull --rebase origin main; git push origin HEAD:main))
