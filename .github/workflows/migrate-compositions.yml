name: Migrate image compositions to editable text (one time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: OCR requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
          python -m pip install Pillow
      - name: Extract each image into editable Markdown
        run: python scripts/migrate_compositions.py
      - name: Save source text and review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/cards migration-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import 191 composition texts from original images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
