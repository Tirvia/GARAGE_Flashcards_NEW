name: Rebuild menu data
on:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/**', '.github/workflows/build-menu.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: garage-menu-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild catalog from latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-menu.cjs
            git add js/menu-data.js js/menu-changes.js content/ data/composition-import-baseline.json data/menu-change-history.json .pages.yml
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Rebuild menu catalog"
            if git push origin HEAD:main; then exit 0; fi
            echo "Retrying on a newer main branch"
          done
          exit 1
