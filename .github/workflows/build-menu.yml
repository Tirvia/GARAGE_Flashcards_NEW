name: Rebuild menu data
on:
  push:
    branches: [main]
    paths: ['content/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/build-menu.cjs
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/menu-data.js
          git diff --staged --quiet || (git commit -m "Rebuild menu catalog" && git push)
