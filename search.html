<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск | GARAGE</title>
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23D32F2F' rx='20'/%3E%3Ctext x='50' y='72' font-size='64' font-family='Arial, sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <style>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }

        body {
            background:#000;
            color:#fff;
            min-height:100vh;
            min-height:100dvh;
            display:flex;
            flex-direction:column;
        }

        /* ===== STICKY HEADER ===== */
        .sticky-top {
            position:sticky;
            top:0;
            z-index:200;
            background:#000;
            border-bottom:1px solid #1c1c1c;
            padding:12px 16px 14px;
        }

        .header-row {
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:10px;
        }

        .back-btn {
            display:inline-flex;
            align-items:center;
            color:#666;
            text-decoration:none;
            font-size:0.9rem;
            white-space:nowrap;
            flex-shrink:0;
            padding:6px 0;
            transition:color 0.2s;
            -webkit-tap-highlight-color:transparent;
        }
        .back-btn:active { color:#fff; }

        .page-title {
            flex:1;
            text-align:center;
            font-size:0.95rem;
            font-weight:bold;
            color:#f0cece;
        }

        /* ===== ПОИСКОВАЯ СТРОКА ===== */
        .search-wrap { position:relative; }

        .search-row {
            display:flex;
            align-items:center;
            background:#111;
            border:2px solid #222;
            border-radius:14px;
            transition:border-color 0.2s, box-shadow 0.2s;
        }

        .search-row.focused {
            border-color:#ff0000;
            box-shadow:0 0 0 3px rgba(255,0,0,0.12);
        }

        .search-icon {
            padding:0 4px 0 14px;
            font-size:1rem;
            color:#555;
            flex-shrink:0;
            pointer-events:none;
        }

        #searchInput {
            flex:1;
            padding:13px 8px;
            background:transparent;
            border:none;
            color:#fff;
            font-size:1rem;
            outline:none;
            min-width:0;
            -webkit-appearance:none;
        }
        /* iOS: предотвращаем авто-зум при фокусе */
        @media (max-width:768px) { #searchInput { font-size:16px; } }

        #searchInput::placeholder { color:#444; }

        .clear-btn {
            display:none;
            align-items:center;
            justify-content:center;
            width:34px;
            height:34px;
            margin-right:7px;
            background:#1e1e1e;
            border:none;
            border-radius:50%;
            color:#666;
            font-size:0.85rem;
            cursor:pointer;
            flex-shrink:0;
            -webkit-tap-highlight-color:transparent;
            transition:background 0.15s, color 0.15s;
        }
        .clear-btn.visible { display:flex; }
        .clear-btn:active { background:#333; color:#fff; }

        /* ===== ВЫПАДАЮЩИЙ СПИСОК (как в браузере) ===== */
        .search-dropdown {
            display:none;
            position:absolute;
            top:calc(100% + 7px);
            left:0;
            right:0;
            background:#111;
            border:1.5px solid #2a2a2a;
            border-radius:14px;
            overflow:hidden;
            z-index:300;
            box-shadow:0 16px 48px rgba(0,0,0,0.85);
            max-height:55vh;
            overflow-y:auto;
            -webkit-overflow-scrolling:touch;
        }
        .search-dropdown.open { display:block; }

        .dd-item {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px 16px;
            cursor:pointer;
            border-bottom:1px solid #191919;
            -webkit-tap-highlight-color:transparent;
            transition:background 0.1s;
        }
        .dd-item:last-child { border-bottom:none; }
        .dd-item:active,
        .dd-item:hover { background:rgba(255,0,0,0.1); }

        .dd-icon { font-size:1.25rem; flex-shrink:0; width:26px; text-align:center; }

        .dd-text { flex:1; min-width:0; }

        .dd-name {
            font-size:0.95rem;
            font-weight:500;
            color:#eee;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .dd-name mark { background:transparent; color:#ff4d4d; font-weight:bold; }

        .dd-section { font-size:0.76rem; color:#555; margin-top:2px; }

        .dd-arrow { color:#555; font-size:1rem; flex-shrink:0; }

        .dd-no-results {
            padding:22px 16px;
            text-align:center;
            color:#444;
            font-size:0.9rem;
        }

        /* ===== КОНТЕНТНАЯ ЗОНА ===== */
        .content-area {
            flex:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:0 16px 60px;
            max-width:560px;
            width:100%;
            margin:0 auto;
        }

        /* ===== ПУСТОЕ СОСТОЯНИЕ ===== */
        .empty-state {
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            flex:1;
            padding:50px 20px;
            text-align:center;
            user-select:none;
        }
        .empty-icon { font-size:3.5rem; opacity:0.2; margin-bottom:16px; }
        .empty-text { color:#383838; font-size:0.95rem; line-height:1.7; }

        /* ===== КАРТОЧКА ===== */
        .card-viewer {
            display:none;
            flex-direction:column;
            align-items:center;
            width:100%;
            max-width:500px;
            margin:0 auto;
            padding-top:18px;
            animation:fadeUp 0.22s ease;
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(10px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* Мета-строка над карточкой */
        .card-meta {
            width:100%;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-bottom:12px;
        }

        .card-section-lbl {
            font-size:0.78rem;
            color:#ff4d4d;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .search-again-btn {
            display:inline-flex;
            align-items:center;
            gap:5px;
            background:#131313;
            border:1.5px solid #252525;
            border-radius:20px;
            color:#777;
            font-size:0.8rem;
            padding:6px 13px;
            cursor:pointer;
            white-space:nowrap;
            flex-shrink:0;
            -webkit-tap-highlight-color:transparent;
            transition:border-color 0.2s, color 0.2s;
        }
        .search-again-btn:active,
        .search-again-btn:hover { border-color:#ff0000; color:#fff; }

        /* 3D карточка */
        .flip-container {
            width:100%;
            max-width:500px;
            margin:0 auto;
            perspective:1000px;
            cursor:pointer;
            -webkit-tap-highlight-color:transparent;
            touch-action:manipulation;
            display:flex;
            justify-content:center;
        }

        .flip-inner {
            position:relative;
            width:-webkit-fit-content;
            width:fit-content;
            transition:transform 0.55s cubic-bezier(0.4,0,0.2,1);
            transform-style:preserve-3d;
        }

        .flip-container.flipped .flip-inner { transform:rotateY(180deg); }

        .flip-front,
        .flip-back {
            position:relative;
            backface-visibility:hidden;
            -webkit-backface-visibility:hidden;
            border-radius:12px;
            overflow:hidden;
        }

        .flip-back {
            position:absolute;
            top:0; left:0;
            transform:rotateY(180deg);
        }

        .flip-name-overlay {
            position:absolute;
            top:0; left:0; right:0;
            z-index:2;
            pointer-events:none;
            color:#fff;
            font-size:0.95rem;
            font-weight:bold;
            text-align:center;
            background:linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0) 100%);
            padding:12px 12px 32px;
            border-radius:12px 12px 0 0;
            text-shadow:0 1px 5px rgba(0,0,0,0.95);
            line-height:1.35;
        }

        .card-img {
            width:auto;
            max-width:min(500px, calc(100vw - 32px));
            height:auto;
            max-height:400px;
            display:block;
            border-radius:12px;
        }

        /* Большая кнопка переворота — удобная на телефоне */
        .flip-action-btn {
            margin-top:14px;
            width:100%;
            padding:15px 20px;
            background:#141414;
            border:1.5px solid #252525;
            border-radius:12px;
            color:#bbb;
            font-size:1rem;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            -webkit-tap-highlight-color:transparent;
            touch-action:manipulation;
            transition:border-color 0.2s, background 0.2s, color 0.2s;
        }
        .flip-action-btn:active,
        .flip-action-btn:hover {
            border-color:#ff0000;
            background:rgba(255,0,0,0.07);
            color:#fff;
        }

        .tap-hint {
            margin-top:9px;
            font-size:0.75rem;
            color:#282828;
            text-align:center;
        }

        /* ===== МОБИЛЬНЫЕ ПРАВКИ ===== */
        @media (max-width:480px) {
            .sticky-top { padding:10px 12px 12px; }
            .page-title { font-size:0.88rem; }
            .back-btn { font-size:0.85rem; }
            .content-area { padding:0 12px 60px; }
            .search-dropdown { max-height:48vh; }
            .flip-name-overlay { font-size:0.92rem; }
            .flip-action-btn { font-size:0.95rem; padding:14px 16px; }
        }
    .flip-back { background: white url("images/composition-background.png") center / 100% 100% no-repeat; }
</style>
</head>
<body>

<!-- STICKY HEADER -->
<div class="sticky-top">
    <div class="header-row">
        <a href="index.html" class="back-btn">← Меню</a>
        <div class="page-title">🔍 Меню GARAGE</div>
    </div>

    <div class="search-wrap" id="searchWrap">
        <div class="search-row" id="searchRow">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput"
                   placeholder="Название блюда или напитка..."
                   autocomplete="off" autocorrect="off"
                   autocapitalize="off" spellcheck="false"
                   enterkeyhint="search">
            <button class="clear-btn" id="clearBtn" aria-label="Очистить">✕</button>
        </div>
        <!-- Выпадающий список появляется здесь -->
        <div class="search-dropdown" id="searchDropdown"></div>
    </div>
</div>

<!-- КОНТЕНТНАЯ ЗОНА -->
<div class="content-area">

    <div class="empty-state" id="emptyState">
        <div class="empty-icon">🍽️</div>
        <div class="empty-text">Нажми на строку поиска<br>и введи название блюда или напитка</div>
    </div>

    <div class="card-viewer" id="cardViewer">
        <div class="card-meta">
            <span class="card-section-lbl" id="cardSectionLbl"></span>
            <button class="search-again-btn" id="searchAgainBtn">🔍 Найти другое</button>
        </div>

        <div class="flip-container" id="flipContainer">
            <div class="flip-inner" id="flipInner">
                <div class="flip-front">
                    <div class="flip-name-overlay" id="flipNameOverlay"></div>
                    <img class="card-img" id="cardFrontImg" src="" alt="">
                </div>
                <div class="flip-back">
                    <img class="card-img" id="cardBackImg" src="" alt="">
                </div>
            </div>
        </div>

        <button class="flip-action-btn" id="flipActionBtn">
            <span>🔄</span><span id="flipBtnText">Посмотреть состав</span>
        </button>
        <div class="tap-hint">или нажми прямо на карточку</div>
    </div>

</div>

<script src="js/menu-data.js"></script>
<script src="js/text-answer.js"></script>
<script>

const M=window.GARAGE_MENU;
const ICONS=Object.fromEntries(M.sections.map(s=>[s.id,s.icon]));
const SECS=Object.fromEntries(M.sections.map(s=>[s.id,s.name]));
const ALL=M.cards.filter(c=>c.status==="published").map(c=>({s:c.section,i:c.runtimeIndex??0,n:c.title,id:c.id,front:c.front,back:c.back,answerText:c.answerText||"",t:c.tags||[],kb:c.brothNote||false}));

// ===== ELEMENTS =====
const searchInput     = document.getElementById('searchInput');
const searchRow       = document.getElementById('searchRow');
const clearBtn        = document.getElementById('clearBtn');
const dropdown        = document.getElementById('searchDropdown');
const emptyState      = document.getElementById('emptyState');
const cardViewer      = document.getElementById('cardViewer');
const cardSectionLbl  = document.getElementById('cardSectionLbl');
const flipContainer   = document.getElementById('flipContainer');
const flipInner       = document.getElementById('flipInner');
const cardFrontImg    = document.getElementById('cardFrontImg');
const cardBackImg     = document.getElementById('cardBackImg');
const flipNameOverlay = document.getElementById('flipNameOverlay');
const flipActionBtn   = document.getElementById('flipActionBtn');
const flipBtnText     = document.getElementById('flipBtnText');
const searchAgainBtn  = document.getElementById('searchAgainBtn');

let isFlipped = false;

// ===== HIGHLIGHT =====
function hl(text, q) {
    const e = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return text.replace(new RegExp(`(${e})`,'gi'),'<mark>$1</mark>');
}

// ===== DROPDOWN =====
function showDropdown(query) {
    const q = query.trim().toLowerCase();
    if (!q) { hideDropdown(); return; }

    const hits = ALL.filter(it => it.n.toLowerCase().includes(q)).slice(0,14);

    dropdown.innerHTML = hits.length
        ? hits.map(it =>
            `<div class="dd-item" data-s="${it.s}" data-i="${it.i}" data-n="${it.n.replace(/"/g,'&quot;')}">
                <span class="dd-icon">${ICONS[it.s]||'📋'}</span>
                <span class="dd-text">
                    <span class="dd-name">${hl(it.n, query.trim())}</span>
                    <span class="dd-section">${SECS[it.s]||it.s}</span>
                </span>
                <span class="dd-arrow">›</span>
            </div>`).join('')
        : '<div class="dd-no-results">Ничего не найдено 🤷</div>';

    dropdown.classList.add('open');
}

function hideDropdown() { dropdown.classList.remove('open'); }

// ===== CARD =====
function setFlip(flipped) {
    isFlipped = flipped;
    flipContainer.classList.toggle('flipped', flipped);
    flipBtnText.textContent = flipped ? 'Посмотреть фото блюда' : 'Посмотреть состав';
}

function openCard(s, i, n) {
    hideDropdown();
    searchInput.blur();

    // Мгновенный сброс переворота
    flipInner.style.transition = 'none';
    flipContainer.classList.remove('flipped');
    flipInner.offsetHeight; // reflow
    flipInner.style.transition = '';
    isFlipped = false;
    flipBtnText.textContent = 'Посмотреть состав';

    flipNameOverlay.textContent = n;
    cardSectionLbl.textContent  = (ICONS[s]||'') + ' ' + (SECS[s]||s);
    cardFrontImg.src = (ALL.find(x=>x.s===s&&x.i===i)?.front || `images/${s}/${i}.png`);
    cardBackImg.src  = window.GARAGE_answerSrc(M.cards.find(x=>x.section===s&&x.runtimeIndex===i));

    emptyState.style.display  = 'none';
    cardViewer.style.display  = 'flex';
    window.scrollTo({top:0, behavior:'smooth'});
}

// ===== EVENTS =====
searchInput.addEventListener('input', function() {
    clearBtn.classList.toggle('visible', this.value.length > 0);
    showDropdown(this.value);
});

searchInput.addEventListener('focus', function() {
    searchRow.classList.add('focused');
    if (this.value.trim()) showDropdown(this.value);
});

searchInput.addEventListener('blur', function() {
    searchRow.classList.remove('focused');
});

searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { hideDropdown(); this.blur(); }
    if (e.key === 'Enter') {
        const first = dropdown.querySelector('.dd-item');
        if (first) openCard(first.dataset.s, parseInt(first.dataset.i), first.dataset.n);
    }
});

// mousedown (до blur) — для десктопа
dropdown.addEventListener('mousedown', function(e) {
    const it = e.target.closest('.dd-item');
    if (!it) return;
    e.preventDefault();
    openCard(it.dataset.s, parseInt(it.dataset.i), it.dataset.n);
});

// touchend — для мобильных
dropdown.addEventListener('touchend', function(e) {
    const it = e.target.closest('.dd-item');
    if (!it) return;
    e.preventDefault();
    openCard(it.dataset.s, parseInt(it.dataset.i), it.dataset.n);
}, {passive:false});

// Очистить
clearBtn.addEventListener('mousedown', function(e) {
    e.preventDefault();
    searchInput.value = '';
    clearBtn.classList.remove('visible');
    hideDropdown();
    searchInput.focus();
});
clearBtn.addEventListener('touchend', function(e) {
    e.preventDefault();
    searchInput.value = '';
    clearBtn.classList.remove('visible');
    hideDropdown();
    searchInput.focus();
}, {passive:false});

// Клик мимо — закрыть дропдаун
document.addEventListener('mousedown', function(e) {
    if (!document.getElementById('searchWrap').contains(e.target)) hideDropdown();
});

// Переворот
flipContainer.addEventListener('click', () => setFlip(!isFlipped));
flipActionBtn.addEventListener('click', function(e) { e.stopPropagation(); setFlip(!isFlipped); });

// Найти другое — фокус на поиск
searchAgainBtn.addEventListener('click', function() {
    searchInput.focus();
    searchInput.select();
    if (searchInput.value.trim()) showDropdown(searchInput.value);
});

// Автофокус только на десктопе
if (!('ontouchstart' in window)) {
    searchInput.focus();
}
</script>
</body>
</html>
